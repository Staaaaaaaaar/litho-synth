[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lithosynth"
version = "0.1.1"
description = "Controllable and reproducible synthetic rock scene generation with BlenderProc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "blenderproc==2.8.0",
  "h5py",
  "matplotlib",
  "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/generate_scene.py" = ["I001"]
